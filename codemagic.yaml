# Codemagic CI for the Ebb iOS app (branch main).
# One-time dashboard setup: Ebb/CODEMAGIC_SETUP.md
#
# Unit tests run unsigned on the iOS Simulator. Device installs require an
# Apple Distribution certificate and Ad Hoc provisioning profile uploaded in
# Codemagic Code signing identities (see CODEMAGIC_SETUP.md).

workflows:
  ebb-unit-tests:
    name: Ebb — Unit tests
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: Ebb
    environment:
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - Ebb/**
          - codemagic.yaml
    scripts:
      - name: Install dependencies
        script: |
          set -euo pipefail
          gem install bundler --no-document
          bundle install --jobs 4 --retry 3
      - name: Run unit tests
        script: bundle exec fastlane test

  ebb-adhoc-device:
    name: Ebb — Ad Hoc (install on device)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: Ebb
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.bcbs.ebb
    # Manual start only — download the IPA from build artifacts and install via Finder or Apple Configurator.
    scripts:
      - name: Install dependencies
        script: |
          set -euo pipefail
          gem install bundler --no-document
          bundle install --jobs 4 --retry 3
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build Ad Hoc IPA
        script: bundle exec fastlane adhoc
    artifacts:
      - fastlane/output/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - brubaudel@gmail.com
        notify:
          success: true
          failure: true
