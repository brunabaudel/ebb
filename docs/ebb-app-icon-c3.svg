<!--
  Ebb iOS app icon — C3 listen-glow (exact sketch recipe).

  Background CSS (glow composited over oat, not transparent):
    background:
      radial-gradient(circle at 50% 50%, rgba(198,126,114,.35), rgba(91,154,143,.12) 55%, #F8F4EF 100%),
      #F8F4EF;

  Mascot: centered Ebb droplet at 72% of canvas (.ebb-svg in sketch).
  Gradient: #E8B8C4 → #C2607A. Listen eyes + soft smile. No S-mark.

  PNG export: use docs/ebb-app-icon-c3-render.html via Chrome headless @ 1024×1024.
  Do NOT use rsvg-convert on this SVG — semi-transparent gradient stops composite over black.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Opaque stops: rgba glow pre-composited over #F8F4EF -->
    <radialGradient id="glow" cx="50%" cy="50%" r="70.71%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E7CBC3"/>
      <stop offset="55%" stop-color="#E5E9E3"/>
      <stop offset="100%" stop-color="#F8F4EF"/>
    </radialGradient>
    <linearGradient id="drop" x1="34" y1="22" x2="86" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8B8C4"/>
      <stop offset="1" stop-color="#C2607A"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#F8F4EF"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <svg x="143.36" y="143.36" width="737.28" height="737.28" viewBox="0 0 120 120">
    <path d="M60 20C60 20 30 52 30 72c0 17.673 13.431 32 30 32s30-14.327 30-32C90 52 60 20 60 20Z" fill="url(#drop)"/>
    <path d="M48 60c0-1.2.9-2.2 2-2.2h0c1.1 0 2 1 2 2.2v6c0 1.2-.9 2.2-2 2.2h0c-1.1 0-2-1-2-2.2z" fill="#2A2622" opacity="0.45"/>
    <path d="M68 60c0-1.2.9-2.2 2-2.2h0c1.1 0 2 1 2 2.2v6c0 1.2-.9 2.2-2 2.2h0c-1.1 0-2-1-2-2.2z" fill="#2A2622" opacity="0.45"/>
    <path d="M54 76c3.2 2.4 8.8 2.4 12 0" stroke="#2A2622" stroke-width="2.1" stroke-linecap="round" opacity="0.35" fill="none"/>
  </svg>
</svg>
